name: CI - Develop

permissions:
  contents: write

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Actualizar README con nueva feature"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
          } else {
            Write-Host "DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN"
            exit 1
          }